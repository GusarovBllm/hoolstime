<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HoolsTime — Форум</title>
<meta name="description" content="Форум HoolsTime: обсуждения, гайды, торговля, кланы.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a1a1a;--bg2:#202020;--card:#252525;--card2:#2a2a2a;--border:#333;--border2:#444;--title:#e0e0e0;--body:#b0b0b0;--body50:#808080;--muted:#606060;--accent:#4a7cff;--accent2:#6c8cff;--gold:#f0b429;--red:#ef4444;--green:#22c55e;--blue:#3b82f6;--orange:#f59e0b;--radius:6px;--header-h:52px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--body);font-family:'Montserrat',sans-serif;min-height:100vh;overflow-x:hidden}
::selection{background:var(--accent);color:#fff}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit;outline:none}

/* ─── Header ─── */
header{background:var(--bg2);border-bottom:1px solid var(--border);position:fixed;top:0;left:0;right:0;z-index:1000;height:var(--header-h)}
.hdr-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:100%}
.hdr-l{display:flex;align-items:center;gap:16px}
.hdr-l .logo{font-size:16px;font-weight:900;color:var(--title)}
.hdr-l .logo .h{color:var(--accent)}
.hdr-l .logo .t{color:var(--accent2)}
.hdr-nav{display:flex;gap:0}
.hdr-nav a{padding:14px 12px;font-size:13px;font-weight:600;color:var(--body50);transition:.15s;border-bottom:2px solid transparent}
.hdr-nav a:hover,.hdr-nav a.active{color:var(--title);border-bottom-color:var(--accent)}
.hdr-r{display:flex;align-items:center;gap:8px}
.hdr-r .btn{background:var(--accent);color:#fff;border:none;border-radius:4px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer}
.hdr-r .btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--body);padding:5px 12px;border-radius:4px;font-size:12px;font-weight:600}
.hdr-r .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}

/* ─── Page ─── */
.page{max-width:1200px;margin:0 auto;padding:calc(var(--header-h) + 20px) 16px 40px}
.p-title{font-size:18px;font-weight:900;color:var(--title);margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}

/* ─── Node / Category ─── */
.block{margin-bottom:16px}
.block-header{background:var(--bg2);border:1px solid var(--border);border-bottom:none;padding:10px 14px;font-size:13px;font-weight:700;color:var(--body50);text-transform:uppercase;letter-spacing:1px;border-radius:var(--radius) var(--radius) 0 0}
.node{background:var(--card);border:1px solid var(--border);border-top:none;padding:12px 14px;display:grid;grid-template-columns:40px 1fr 100px 240px;gap:12px;align-items:center;transition:background .1s}
.node:first-of-type{border-top:1px solid var(--border)}
.node:last-of-type{border-radius:0 0 var(--radius) var(--radius)}
.node:hover{background:var(--card2)}
.node-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--bg2);color:var(--body50)}
.node-main h3{font-size:14px;font-weight:700;color:var(--title)}
.node-main .node-desc{font-size:11px;color:var(--body50);margin-top:2px}
.node-meta{display:flex;gap:12px;font-size:11px;color:var(--body50);margin-top:3px}
.node-stats{text-align:center;font-size:11px;color:var(--body50)}
.node-stats b{color:var(--body)}
.node-extra{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--body50)}
.node-extra .ava{width:28px;height:28px;border-radius:50%;overflow:hidden;flex:0 0 28px;background:var(--accent);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700}
.node-extra .l-title{color:var(--title);font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.node-extra .l-meta{font-size:10px;color:var(--body50);margin-top:1px}
.label{display:inline-block;padding:2px 6px;border-radius:3px;font-size:9px;font-weight:800;text-transform:uppercase;margin-right:4px}
.label-important{background:rgba(239,68,68,.15);color:var(--red)}
.sub-nodes{margin-top:4px;font-size:11px}
.sub-nodes a{color:var(--body50);margin-right:8px}
.sub-nodes a:hover{color:var(--accent)}

/* ─── Topics ─── */
.topic-bar{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.topic-bar h2{font-size:16px;font-weight:900;color:var(--title)}
.topic-row{padding:12px 16px;background:var(--card);border:1px solid var(--border);border-top:none;display:grid;grid-template-columns:1fr auto;gap:8px;cursor:pointer;transition:background .1s}
.topic-row:first-of-type{border-top:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0}
.topic-row:last-of-type{border-radius:0 0 var(--radius) var(--radius)}
.topic-row:hover{background:var(--card2)}
.topic-row .t-title{font-size:13px;font-weight:600;color:var(--title)}
.topic-row .t-meta{font-size:11px;color:var(--body50);margin-top:3px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.topic-row .t-right{text-align:right;font-size:11px;color:var(--body50)}

/* ─── Auth Modal ─── */
.modal-ov{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-ov.open{display:flex}
.modal{width:460px;max-width:100%;max-height:92vh;overflow:auto;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:24px}
.modal h3{font-size:18px;font-weight:900;color:var(--title);margin-bottom:4px;text-align:center}
.modal .sub{color:var(--body50);font-size:13px;margin-bottom:16px;text-align:center}
.modal .m-close{float:right;background:none;border:none;color:var(--body50);font-size:20px;cursor:pointer}
.modal .m-close:hover{color:var(--red)}
.mtabs{display:flex;gap:6px;margin-bottom:16px;justify-content:center}
.mtab{background:var(--card);border:1px solid var(--border);color:var(--body50);padding:7px 18px;border-radius:4px;font-size:12px;font-weight:700}
.mtab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11px;font-weight:700;color:var(--body);margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.fld input{width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--title);border-radius:4px;padding:9px 12px;font-size:13px}
.fld input:focus{border-color:var(--accent)}
.btn{background:var(--accent);color:#fff;border:none;border-radius:4px;padding:9px 16px;font-size:12px;font-weight:800;transition:.2s;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--body)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:var(--red);color:#fff}
.btn-full{width:100%}

/* ─── Roles ─── */
.role-tag{display:inline-block;padding:2px 6px;border-radius:3px;font-size:9px;font-weight:800;text-transform:uppercase}
.role-tag.player{background:rgba(148,163,184,.12);color:#94a3b8}
.role-tag.verified{background:rgba(34,197,94,.12);color:var(--green)}
.role-tag.helper{background:rgba(240,180,41,.12);color:var(--gold)}
.role-tag.mod{background:rgba(59,130,246,.12);color:var(--blue)}
.role-tag.admin{background:rgba(239,68,68,.15);color:var(--red)}
.avatar{width:32px;height:32px;border-radius:50%;overflow:hidden;flex:0 0 32px;display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;font-size:12px;font-weight:700;background-size:cover;background-position:center}
.avatar-sm{width:24px;height:24px;font-size:10px;flex:0 0 24px}

/* ─── Notif ─── */
.notif{position:fixed;top:60px;right:16px;z-index:3000;background:var(--bg2);border:1px solid var(--border2);border-left:3px solid var(--green);color:var(--body);padding:10px 14px;border-radius:4px;font-size:12px;box-shadow:0 8px 30px rgba(0,0,0,.4);animation:tin .25s ease;max-width:320px}
.notif.err{border-left-color:var(--red)}
.notif.gold{border-left-color:var(--gold)}
@keyframes tin{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
footer{background:var(--bg2);border-top:1px solid var(--border);padding:16px;text-align:center;font-size:12px;color:var(--muted);margin-top:40px}
footer a{color:var(--body50);margin:0 8px}
footer a:hover{color:var(--accent)}
</style>
</head>
<body>

<header>
  <div class="hdr-inner">
    <div class="hdr-l">
      <a href="https://gusarovbllm.github.io/hoolstime/" class="logo"><span class="h">H</span><span class="t">oolsTime</span></a>
      <nav class="hdr-nav">
        <a href="#" class="active">Форумы</a>
        <a href="https://gusarovbllm.github.io/hoolstime/">Магазин</a>
      </nav>
    </div>
    <div class="hdr-r" id="hdrRight">
      <span id="hdrLogged" style="display:none">
        <span id="hdrUser" style="font-size:13px;font-weight:600;color:var(--accent)"></span>
        <button class="btn-ghost" style="padding:4px 10px;font-size:11px" onclick="showProfile(curUser.login)">Профиль</button>
        <button class="btn-ghost" style="padding:4px 10px;font-size:11px" onclick="logoutUser()">Выйти</button>
      </span>
      <span id="hdrGuest">
        <button class="btn-ghost" onclick="openAuthModal('login')">Авторизация</button>
      </span>
    </div>
  </div>
</header>

<div class="page" id="pageContent">
  <div class="p-title">
    <span>HoolsTime — Сообщество</span>
    <button class="btn btn-sm btn-ghost" onclick="showCreateTicket()">✉️ Поддержка</button>
  </div>
  <div id="forumView">
    <div id="forumCategories"></div>
    <div id="topicView" style="display:none">
      <div class="topic-bar">
        <h2 id="tvTitle"></h2>
        <div style="display:flex;gap:6px">
          <button class="btn btn-sm" onclick="showTopicForm()">+ Новая тема</button>
          <button class="btn btn-sm btn-ghost" onclick="backToForum()">← Назад</button>
        </div>
      </div>
      <div id="topicList"></div>
    </div>
    <div id="topicFormArea" style="display:none">
      <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px">
        <h3 style="font-size:14px;font-weight:900;color:var(--title);margin-bottom:12px">Новая тема</h3>
        <div id="topicForm"></div>
      </div>
    </div>
  </div>
  <div id="profileView" style="display:none"></div>
  <div id="ticketFormArea" style="display:none">
    <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="font-size:14px;font-weight:900;color:var(--title)">✉️ Поддержка</h3><button class="btn btn-sm btn-ghost" onclick="$('ticketFormArea').style.display='none'">✕</button></div>
      <div class="fld"><label>Тема</label><input id="tktSubj" placeholder="Кратко опишите проблему"></div>
      <div class="fld"><label>Сообщение</label><textarea id="tktBody" style="width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--title);border-radius:4px;padding:9px;font-size:13px;min-height:60px;font-family:inherit"></textarea></div>
      <button class="btn" onclick="submitTicket()">Отправить</button><div id="tktMsg" style="margin-top:6px;font-size:12px"></div>
    </div>
  </div>
</div>

<div class="modal-ov" id="authModal">
  <div class="modal">
    <button class="m-close" onclick="closeAuthModal()">✕</button>
    <h3 id="authTitle">Авторизация</h3>
    <div class="sub" id="authSub">Войдите или зарегистрируйтесь</div>
    <div class="mtabs">
      <button class="mtab active" data-t="login" onclick="switchAuth('login')">Вход</button>
      <button class="mtab" data-t="register" onclick="switchAuth('register')">Регистрация</button>
    </div>
    <div id="authLogin">
      <div class="fld"><label>Логин или почта</label><input type="text" id="loginId" placeholder="ivan или ivan@mail.ru"></div>
      <div class="fld"><label>Пароль</label><input type="password" id="loginPwd" placeholder="••••••••"></div>
      <button class="btn btn-full" onclick="loginUser()">Войти</button>
      <div id="loginMsg" style="margin-top:6px;font-size:12px;text-align:center"></div>
    </div>
    <div id="authRegister" style="display:none">
      <div class="fld"><label>Имя</label><input type="text" id="regLogin" maxlength="24"><div style="font-size:10px;color:var(--muted);margin-top:2px">После регистрации нельзя изменить</div></div>
      <div class="fld"><label>Email</label><input type="email" id="regEmail" placeholder="ivan@mail.ru"></div>
      <div class="fld"><label>Пароль</label><input type="password" id="regPwd"></div>
      <div class="fld"><label>Подтверждение</label><input type="password" id="regPwd2"></div>
      <button class="btn btn-full" onclick="registerUser()">Зарегистрироваться</button>
      <div id="regMsg" style="margin-top:6px;font-size:12px;text-align:center"></div>
    </div>
  </div>
</div>

<footer>
  <a href="https://gusarovbllm.github.io/hoolstime/">Магазин</a> · <a href="#">Форум</a> · © 2026 HoolsTime
</footer>

<script>
const CATS=[{id:'discuss',ic:'💬',name:'Обсуждения',desc:'Свободное общение, вопросы по игре.'},{id:'guides',ic:'📘',name:'Гайды',desc:'Советы по выживанию, крафту, защите баз.'},{id:'trade',ic:'💰',name:'Торговля',desc:'Обмен ресурсами.'},{id:'clans',ic:'⚔️',name:'Кланы',desc:'Создание и набор участников.'}];
const ROLES_RU={guest:'Гость',player:'Игрок',verified:'Проверенный',helper:'Хелпер',moderator:'Модератор',admin:'Администратор'};
let curUser=null,curSection=null;
function $(id){return document.getElementById(id)}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function notif(t,type){const d=document.createElement('div');d.className='notif'+(type?' '+type:'');d.textContent=t;document.body.appendChild(d);setTimeout(()=>{d.style.opacity='0';d.style.transition='opacity .3s';setTimeout(()=>d.remove(),300)},3200)}
function nowISO(){return new Date().toISOString()}
function getUsers(){return JSON.parse(localStorage.getItem('ht_users')||'[]')}
function saveUsers(u){localStorage.setItem('ht_users',JSON.stringify(u))}
function getTopics(s){const a=JSON.parse(localStorage.getItem('ht_topics')||'[]');return s?a.filter(t=>t.section===s).sort((a,b)=>new Date(b.date)-new Date(a.date)):a}
function saveTopics(t){localStorage.setItem('ht_topics',JSON.stringify(t))}

function updateStats(){}

function openAuthModal(tab){$('authModal').classList.add('open');switchAuth(tab||'login')}
function closeAuthModal(){$('authModal').classList.remove('open')}
function switchAuth(t){document.querySelectorAll('.mtab').forEach(b=>b.classList.toggle('active',b.dataset.t===t));$('authLogin').style.display=t==='login'?'block':'none';$('authRegister').style.display=t==='register'?'block':'none';$('authTitle').textContent=t==='login'?'Авторизация':'Регистрация';$('authSub').textContent=t==='login'?'Войдите в аккаунт':'Создайте аккаунт'}
$('authModal').addEventListener('click',e=>{if(e.target===$('authModal'))closeAuthModal()})
function registerUser(){const l=$('regLogin').value.trim(),e=$('regEmail').value.trim(),p=$('regPwd').value,p2=$('regPwd2').value,m=$('regMsg');if(l.length<3){m.textContent='Логин минимум 3 символа';return}if(!e.includes('@')){m.textContent='Некорректный email';return}if(p.length<6||p!==p2){m.textContent='Пароль 6+ символов и должен совпадать';return}const ux=getUsers();if(ux.find(x=>x.login===l)){m.textContent='Логин занят';return}if(ux.find(x=>x.email===e)){m.textContent='Email уже используется';return}ux.push({login:l,email:e,pwd:p,role:'player',regDate:nowISO(),bio:'',avatar:'',banner:''});saveUsers(ux);curUser={login:l,role:'player',email:e};localStorage.setItem('ht_curUser',JSON.stringify(curUser));closeAuthModal();m.textContent='';updateUI();notif('Добро пожаловать, '+l+'!','gold')}
function loginUser(){const id=$('loginId').value.trim(),p=$('loginPwd').value,m=$('loginMsg');if(!id||!p){m.textContent='Заполните поля';return}const u=getUsers().find(x=>x.login===id||x.email===id);if(!u||u.pwd!==p){m.textContent='Неверные данные';return}curUser={login:u.login,role:u.role,email:u.email};localStorage.setItem('ht_curUser',JSON.stringify(curUser));closeAuthModal();m.textContent='';updateUI();notif('С возвращением, '+u.login+'!','gold')}
function logoutUser(){curUser=null;localStorage.removeItem('ht_curUser');updateUI();notif('Вы вышли')}
function updateUI(){if(curUser){$('hdrLogged').style.display='inline-flex';$('hdrGuest').style.display='none';$('hdrUser').textContent=curUser.login}else{$('hdrLogged').style.display='none';$('hdrGuest').style.display=''}}

function renderCats(){const g=$('forumCategories');g.innerHTML='';CATS.forEach(c=>{const t=getTopics(c.id);const last=t.length?t[0]:null;g.innerHTML+=`<div class="block"><div class="block-header">${c.name}</div><div class="node" onclick="openSection('${c.id}')"><div class="node-icon">${c.ic}</div><div class="node-main"><h3>${c.name}</h3><div class="node-desc">${c.desc}</div><div class="node-meta"><span>Тем: ${t.length}</span><span>Сообщений: ${t.reduce((s,x)=>s+(x.replies||0),0)+t.length}</span></div></div><div class="node-stats">${t.length}<br><span style="font-size:9px">тем</span></div><div class="node-extra">${last?`<div class="ava">${last.author.charAt(0).toUpperCase()}</div><div><div class="l-title">${esc(last.title)}</div><div class="l-meta">${esc(last.author)} · ${new Date(last.date).toLocaleDateString('ru-RU')}</div></div>`:'<span style="color:var(--muted)">Нет тем</span>'}</div></div></div>`})}

function openSection(id){curSection=id;const c=CATS.find(x=>x.id===id);$('tvTitle').textContent=c.ic+' '+c.name;$('topicView').style.display='block';$('forumCategories').style.display='none';renderTopics(id)}
function backToForum(){$('topicView').style.display='none';$('forumCategories').style.display='grid';$('topicFormArea').style.display='none';curSection=null}
function renderTopics(sId){const l=$('topicList');l.innerHTML='';const t=getTopics(sId);if(!t.length){l.innerHTML='<div style="text-align:center;padding:30px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);color:var(--muted);font-size:13px">В разделе пока нет тем</div>';return}t.forEach(tp=>{const d=document.createElement('div');d.className='topic-row';if(tp.closed)d.style.opacity='.7';d.innerHTML=`<div><div class="t-title">${tp.closed?'🔒 ':''}${esc(tp.title)}</div><div class="t-meta"><a href="javascript:void(0)" onclick="event.stopPropagation();showProfile('${esc(tp.author)}')" style="color:var(--body)">${esc(tp.author)}</a> <span class="role-tag ${tp.authorRole||'player'}">${ROLES_RU[tp.authorRole]||'Игрок'}</span> · ${new Date(tp.date).toLocaleDateString('ru-RU')}</div></div><div class="t-right">💬 ${tp.replies||0}</div>`;d.onclick=()=>openTopic(tp.id);l.appendChild(d)})}

let currentTopicId=null;
function openTopic(id){const topics=getTopics();const tp=topics.find(x=>x.id===id);if(!tp)return;currentTopicId=id;$('topicView').style.display='none';$('topicFormArea').style.display='none';const replies=JSON.parse(localStorage.getItem('ht_replies')||'[]').filter(r=>r.topicId===id);let rh='';replies.forEach(r=>{const u=getUsers().find(x=>x.login===r.author);rh+=`<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:8px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><div class="avatar avatar-sm" style="${u&&u.avatar?'background-image:url('+u.avatar+')':''}">${u&&u.avatar?'':r.author.charAt(0).toUpperCase()}</div><div><div style="font-weight:700;color:var(--title);font-size:13px">${esc(r.author)} <span class="role-tag ${r.authorRole||'player'}">${ROLES_RU[r.authorRole]||'Игрок'}</span></div><div style="font-size:10px;color:var(--body50)">${new Date(r.date).toLocaleString('ru-RU')}</div></div></div><div style="font-size:12px;color:var(--body);line-height:1.6;white-space:pre-wrap">${esc(r.body)}</div></div>`});const u=getUsers().find(x=>x.login===tp.author);const canReply=!tp.closed&&curUser;const canClose=curUser&&(curUser.role==='admin'||curUser.role==='moderator'||curUser.role==='helper');const canDelete=curUser&&curUser.role==='admin';$('forumCategories').innerHTML=`<div style="margin-bottom:16px"><div class="topic-bar"><h2>${tp.closed?'🔒 ':''}${esc(tp.title)}</h2><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-sm btn-ghost" onclick="backFromTopic()">← Назад</button>${canClose?'<button class="btn btn-sm btn-danger" onclick="toggleCloseTopic(\''+tp.id+'\')">'+(tp.closed?'🔓 Открыть':'🔒 Закрыть')+'</button>':''}${canDelete?'<button class="btn btn-sm btn-danger" onclick="deleteTopic(\''+tp.id+'\')">🗑️ Удалить</button>':''}</div></div><div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><div class="avatar avatar-sm" style="${u&&u.avatar?'background-image:url('+u.avatar+')':''}">${u&&u.avatar?'':tp.author.charAt(0).toUpperCase()}</div><div><div style="font-weight:700;color:var(--title);font-size:13px">${esc(tp.author)} <span class="role-tag ${tp.authorRole||'player'}">${ROLES_RU[tp.authorRole]||'Игрок'}</span></div><div style="font-size:10px;color:var(--body50)">${new Date(tp.date).toLocaleString('ru-RU')}</div></div></div><div style="font-size:12px;color:var(--body);line-height:1.6;white-space:pre-wrap">${esc(tp.body)}</div></div>${tp.closed?'<div style="text-align:center;padding:10px;background:rgba(239,68,68,.08);border:1px solid var(--red);border-radius:var(--radius);margin-bottom:12px;color:var(--red);font-size:12px;font-weight:700">🔒 Тема закрыта</div>':''}${rh}${canReply?`<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-top:12px"><h4 style="font-size:13px;font-weight:800;color:var(--title);margin-bottom:8px">✏️ Ответить</h4><textarea id="replyBody" style="width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--title);border-radius:4px;padding:9px;font-size:13px;min-height:50px;font-family:inherit"></textarea><button class="btn btn-sm" style="margin-top:6px" onclick="submitReply('${tp.id}')">Отправить</button><div id="replyMsg" style="margin-top:4px;font-size:12px"></div></div>`:''}</div>`;$('forumCategories').style.display='block'}
function backFromTopic(){$('forumCategories').style.display='none';$('topicView').style.display='block';renderTopics(curSection);currentTopicId=null}
function submitReply(id){const b=$('replyBody')?.value?.trim();if(!b){$('replyMsg').textContent='Напишите ответ';return}const r=JSON.parse(localStorage.getItem('ht_replies')||'[]');r.push({topicId:id,author:curUser.login,authorRole:curUser.role,body:b,date:nowISO()});localStorage.setItem('ht_replies',JSON.stringify(r));const tp=getTopics().find(x=>x.id===id);if(tp)tp.replies=(tp.replies||0)+1;saveTopics(getTopics());$('replyBody').value='';openTopic(id);notif('Ответ отправлен','gold')}
function toggleCloseTopic(id){const t=getTopics();const tp=t.find(x=>x.id===id);if(!tp||!curUser||(curUser.role!=='admin'&&curUser.role!=='moderator'&&curUser.role!=='helper')){notif('Нет прав','err');return}tp.closed=!tp.closed;saveTopics(t);openTopic(id);notif(tp.closed?'Тема закрыта':'Тема открыта','gold')}
function deleteTopic(id){if(!curUser||curUser.role!=='admin'){notif('Нет прав','err');return}if(!confirm('Удалить тему навсегда?'))return;let t=getTopics();t=t.filter(x=>x.id!==id);saveTopics(t);let r=JSON.parse(localStorage.getItem('ht_replies')||'[]');r=r.filter(x=>x.topicId!==id);localStorage.setItem('ht_replies',JSON.stringify(r));backFromTopic();notif('Тема удалена','gold')}

function showTopicForm(){if(!curUser){notif('Войдите сначала','err');return}$('topicFormArea').style.display='block';$('topicForm').innerHTML=`<div class="fld"><label>Заголовок</label><input id="tfTitle"></div><div class="fld"><label>Содержание</label><textarea id="tfBody" style="width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--title);border-radius:4px;padding:9px;font-size:13px;min-height:60px;font-family:inherit"></textarea></div><button class="btn" onclick="submitTopic()">📌 Создать</button><button class="btn btn-ghost" onclick="hideTopicForm()" style="margin-left:6px">Отмена</button><div id="tsMsg" style="margin-top:6px;font-size:12px"></div>`}
function hideTopicForm(){$('topicFormArea').style.display='none'}
function submitTopic(){const t=($('tfTitle')?.value||'').trim(),b=($('tfBody')?.value||'').trim(),m=$('tsMsg');if(!t||!b){m.textContent='Заполните поля';return}const topics=getTopics();topics.push({id:'HT-'+Date.now(),section:curSection,title:t,body:b,author:curUser.login,authorRole:curUser.role,date:nowISO(),replies:0,closed:false});saveTopics(topics);m.textContent='Тема создана!';hideTopicForm();renderTopics(curSection);notif('Тема создана','gold')}

function showProfile(login){const l=login||(curUser?curUser.login:'');if(!l){notif('Войдите','err');return}const u=getUsers().find(x=>x.login===l);if(!u)return;$('forumView').style.display='none';$('profileView').style.display='block';const topics=getTopics().filter(t=>t.author===l);$('profileView').innerHTML=`<div class="topic-bar"><h2>${esc(l)}</h2><button class="btn btn-sm btn-ghost" onclick="closeProfile()">← Назад</button></div><div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px"><div style="display:flex;align-items:center;gap:16px"><div class="avatar" style="width:64px;height:64px;font-size:24px;flex:0 0 64px;${u.avatar?'background-image:url('+u.avatar+')':''}">${u.avatar?'':l.charAt(0).toUpperCase()}</div><div><div style="font-size:20px;font-weight:900;color:var(--title)">${esc(l)}</div><span class="role-tag ${u.role||'player'}">${ROLES_RU[u.role]||'Игрок'}</span><div style="font-size:11px;color:var(--body50);margin-top:4px">Регистрация: ${u.regDate?new Date(u.regDate).toLocaleDateString('ru-RU'):'—'} · Тем: ${topics.length}</div></div></div>${curUser&&curUser.login===l?`<div class="fld" style="margin-top:12px"><label>Аватар</label><input type="file" accept="image/*" onchange="upAvatar(this)"></div><div class="fld"><label>Баннер</label><input type="file" accept="image/*" onchange="upBanner(this)"></div><div class="fld"><label>О себе</label><textarea id="bioInput" style="width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--title);border-radius:4px;padding:9px;font-size:13px;min-height:50px;font-family:inherit">${esc(u.bio||'')}</textarea><button class="btn btn-sm" style="margin-top:6px" onclick="saveBio()">Сохранить</button></div>`:''}</div>`}
function closeProfile(){$('forumView').style.display='block';$('profileView').style.display='none'}
function saveBio(){if(!curUser)return;const u=getUsers();const i=u.findIndex(x=>x.login===curUser.login);if(i<0)return;u[i].bio=$('bioInput').value;saveUsers(u);notif('Сохранено','gold')}
function upAvatar(inp){if(!curUser||!inp.files[0])return;const r=new FileReader();r.onload=function(e){const u=getUsers();const i=u.findIndex(x=>x.login===curUser.login);if(i<0)return;u[i].avatar=e.target.result;saveUsers(u);showProfile(curUser.login);notif('Аватар обновлён','gold')};r.readAsDataURL(inp.files[0])}
function upBanner(inp){if(!curUser||!inp.files[0])return;const r=new FileReader();r.onload=function(e){const u=getUsers();const i=u.findIndex(x=>x.login===curUser.login);if(i<0)return;u[i].banner=e.target.result;saveUsers(u);showProfile(curUser.login);notif('Баннер обновлён','gold')};r.readAsDataURL(inp.files[0])}

function submitTicket(){const s=$('tktSubj').value.trim(),b=$('tktBody').value.trim();if(!s||!b){$('tktMsg').textContent='Заполните поля';return}const tk=JSON.parse(localStorage.getItem('ht_tickets')||'[]');tk.push({id:'TKT-'+Date.now(),subject:s,body:b,author:curUser.login,date:nowISO(),status:'open',answer:''});localStorage.setItem('ht_tickets',JSON.stringify(tk));$('tktMsg').textContent='Тикет отправлен!';$('tktSubj').value='';$('tktBody').value='';notif('Тикет отправлен','gold')}

const saved=localStorage.getItem('ht_curUser');if(saved)curUser=JSON.parse(saved);renderCats();updateUI()
</script>
