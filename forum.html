<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HoolsTime — Форум</title>
<meta name="description" content="Форум HoolsTime: обсуждения, гайды, торговля, кланы.">
<style>
:root{--bg:#0a0b10;--bg2:#0f1017;--card:#151724;--card2:#1a1c2e;--border:#262840;--border2:#32345a;--title:#e8ecf4;--body:#b0b4cc;--body50:#7a7ea0;--muted:#54587a;--accent:#4a7cff;--accent2:#6c8cff;--gold:#f0b429;--red:#ef4444;--green:#22c55e;--blue:#3b82f6;--radius:10px;--header-h:56px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--body);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;min-height:100vh;overflow-x:hidden}
::selection{background:var(--accent);color:#141414}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;outline:none}

/* ─── Header ─── */
header{position:fixed;top:0;left:0;right:0;z-index:1000;height:var(--header-h);background:rgba(10,11,16,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.hdr-l{display:flex;align-items:center;gap:12px}
.hdr-l .logo{font-size:18px;font-weight:900;letter-spacing:-.5px}
.hdr-l .logo .h{background:linear-gradient(180deg,#ff6a4d,#ff2d55);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hdr-l .logo .t{background:linear-gradient(180deg,#7fe3ff,#22d3ee);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hdr-nav{display:flex;gap:2px;margin-left:16px}
.hdr-nav a{padding:7px 12px;border-radius:6px;font-size:12px;font-weight:600;color:var(--body50);transition:all .15s}
.hdr-nav a:hover,.hdr-nav a.active{color:var(--title);background:rgba(255,255,255,.04)}
.hdr-r{display:flex;align-items:center;gap:8px}
.hdr-r .btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:6px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;transition:.15s}
.hdr-r .btn:hover{filter:brightness(1.1)}
.hdr-r .btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--body);padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer}
.hdr-r .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
@media(max-width:820px){.hdr-nav{display:none}}

/* ─── Page ─── */
.page{max-width:1200px;margin:0 auto;padding:calc(var(--header-h) + 20px) 16px 40px;min-height:100vh}

/* ─── Stats bar ─── */
.stats-bar{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:20px;font-size:13px;color:var(--body50)}
.stats-bar b{color:var(--title)}
.stats-bar .sep{color:var(--muted)}

/* ─── Category ─── */
.cat{margin-bottom:20px}
.cat-header{background:var(--card2);border:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.cat-header h3{font-size:14px;font-weight:800;color:var(--title)}
.cat-header .cat-desc{font-size:11px;color:var(--body50);margin-top:2px}

/* ─── Forum row ─── */
.forum-row{background:var(--card);border:1px solid var(--border);border-top:none;padding:14px 16px;display:grid;grid-template-columns:1fr 100px 260px;gap:12px;align-items:center;transition:background .1s}
.forum-row:first-of-type{border-radius:0;border-top:1px solid var(--border)}
.forum-row:last-of-type{border-radius:0 0 var(--radius) var(--radius)}
.forum-row:hover{background:var(--card2)}
.forum-row .fr-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 36px;background:var(--bg2)}
.forum-row .fr-info{display:flex;align-items:center;gap:12px}
.forum-row .fr-info h4{font-size:14px;font-weight:700;color:var(--title)}
.forum-row .fr-info p{font-size:11px;color:var(--body50);margin-top:2px}
.forum-row .fr-stats{text-align:center;font-size:11px;color:var(--body50)}
.forum-row .fr-stats b{color:var(--body)}
.forum-row .fr-last{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--body50)}
.forum-row .fr-last .ava{width:28px;height:28px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700;flex:0 0 28px;overflow:hidden;background-size:cover;background-position:center}
.forum-row .fr-last .l-title{font-size:12px;font-weight:600;color:var(--title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}

/* ─── Topics ─── */
.topic-controls{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius)}
.topic-controls h2{font-size:18px;font-weight:900;color:var(--title)}
.topic-row{display:grid;grid-template-columns:1fr auto;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-top:none;gap:8px;transition:background .1s;cursor:pointer}
.topic-row:first-of-type{border-radius:var(--radius) var(--radius) 0 0;border-top:1px solid var(--border)}
.topic-row:last-of-type{border-radius:0 0 var(--radius) var(--radius)}
.topic-row:hover{background:var(--card2)}
.topic-row .tr-title{font-size:14px;font-weight:600;color:var(--title)}
.topic-row .tr-title .prefix{color:var(--accent);font-size:11px;font-weight:800;margin-right:4px}
.topic-row .tr-meta{font-size:11px;color:var(--body50);margin-top:4px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.topic-row .tr-meta .auth{color:var(--body)}
.topic-row .tr-right{text-align:right;font-size:11px;color:var(--body50);white-space:nowrap}

/* ─── Auth Modal ─── */
.modal-ov{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-ov.open{display:flex}
.modal{width:460px;max-width:100%;max-height:92vh;overflow:auto;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal h3{font-size:20px;font-weight:900;color:var(--title);margin-bottom:4px;text-align:center}
.modal .sub{color:var(--body50);font-size:13px;margin-bottom:18px;text-align:center}
.modal .m-close{float:right;background:none;border:none;color:var(--body50);font-size:20px;cursor:pointer}
.modal .m-close:hover{color:var(--red)}
.mtabs{display:flex;gap:6px;margin-bottom:18px;justify-content:center}
.mtab{background:var(--card);border:1px solid var(--border);color:var(--body50);padding:8px 20px;border-radius:6px;font-size:13px;font-weight:700;transition:.15s}
.mtab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.mtab:hover{border-color:var(--accent)}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--body);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.fld input{width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--title);border-radius:6px;padding:10px 12px;font-size:14px;transition:border-color .2s}
.fld input:focus{border-color:var(--accent)}
.btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:6px;padding:10px 18px;font-size:13px;font-weight:800;transition:.2s;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.97)}
.btn-sm{padding:6px 12px;font-size:11px}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--body);font-weight:600}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:linear-gradient(135deg,var(--red),#dc2626);color:#fff}
.btn-full{width:100%}

/* ─── Avatar ─── */
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;overflow:hidden;background-size:cover;background-position:center;flex:0 0 32px}

/* ─── Role tags ─── */
.role-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.3px}
.role-tag.player{background:rgba(148,163,184,.12);color:#94a3b8}
.role-tag.verified{background:rgba(34,197,94,.12);color:var(--green)}
.role-tag.helper{background:rgba(240,180,41,.12);color:var(--gold)}
.role-tag.mod{background:rgba(59,130,246,.12);color:var(--blue)}
.role-tag.admin{background:rgba(239,68,68,.15);color:var(--red)}

/* ─── Notif ─── */
.notif{position:fixed;top:64px;right:16px;z-index:3000;background:var(--bg2);border:1px solid var(--border2);border-left:3px solid var(--green);color:var(--body);padding:10px 14px;border-radius:6px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.4);animation:tin .25s ease;max-width:320px}
.notif.err{border-left-color:var(--red)}
.notif.gold{border-left-color:var(--gold)}
@keyframes tin{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}

/* ─── Footer ─── */
footer{background:var(--bg2);border-top:1px solid var(--border);padding:18px 16px;text-align:center;font-size:12px;color:var(--muted);margin-top:40px}
footer a{color:var(--body50);margin:0 8px}
footer a:hover{color:var(--accent)}
</style>
</head>
<body>

<header>
  <div class="hdr-l">
    <a href="https://gusarovbllm.github.io/hoolstime/" class="logo"><span class="h">HOOLS</span><span class="t">TIME</span></a>
    <nav class="hdr-nav">
      <a href="https://gusarovbllm.github.io/hoolstime/">Магазин</a>
      <a href="#" class="active">Форум</a>
    </nav>
  </div>
  <div class="hdr-r" id="hdrRight">
    <span id="hdrLogged" style="display:none">
      <span id="hdrUser" style="font-size:13px;font-weight:600;color:var(--accent)"></span>
      <button class="btn-ghost" style="padding:5px 10px;font-size:11px" onclick="showProfile(curUser.login)">Профиль</button>
      <button class="btn-ghost" style="padding:5px 10px;font-size:11px" onclick="logoutUser()">Выйти</button>
    </span>
    <span id="hdrGuest">
      <button class="btn-ghost" onclick="openAuthModal('login')">Вход</button>
      <button class="btn" onclick="openAuthModal('register')">Регистрация</button>
    </span>
  </div>
</header>

<div class="page" id="pageContent">
  <div id="forumView">
    <div class="stats-bar">
      <span>Тем: <b id="stTopics">0</b></span><span class="sep">·</span>
      <span>Сообщений: <b id="stPosts">0</b></span><span class="sep">·</span>
      <span>Пользователей: <b id="stUsers">0</b></span>
    </div>
    <div id="forumCategories"></div>
    <div id="topicView" style="display:none">
      <div class="topic-controls">
        <h2 id="tvTitle"></h2>
        <div style="display:flex;gap:6px">
          <button class="btn btn-sm" onclick="showTopicForm()">+ Новая тема</button>
          <button class="btn btn-sm btn-ghost" onclick="backToForum()">← Назад</button>
        </div>
      </div>
      <div id="topicList"></div>
    </div>
    <div id="topicFormArea" style="display:none">
      <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px">
        <h3 style="font-size:16px;font-weight:900;color:var(--title);margin-bottom:12px">Новая тема</h3>
        <div id="topicForm"></div>
      </div>
    </div>
  </div>
  <div id="profileView" style="display:none"></div>
</div>

<!-- Auth Modal -->
<div class="modal-ov" id="authModal">
  <div class="modal">
    <button class="m-close" onclick="closeAuthModal()">✕</button>
    <h3 id="authTitle">Вход</h3>
    <div class="sub" id="authSub">Войдите или зарегистрируйтесь</div>
    <div class="mtabs">
      <button class="mtab active" data-t="login" onclick="switchAuth('login')">Вход</button>
      <button class="mtab" data-t="register" onclick="switchAuth('register')">Регистрация</button>
    </div>
    <div id="authLogin">
      <div class="fld"><label>Логин или почта</label><input type="text" id="loginId" placeholder="ivan или ivan@mail.ru"></div>
      <div class="fld"><label>Пароль</label><input type="password" id="loginPwd" placeholder="••••••••"></div>
      <button class="btn btn-full" onclick="loginUser()">Войти</button>
      <div id="loginMsg" style="margin-top:8px;font-size:13px;text-align:center"></div>
    </div>
    <div id="authRegister" style="display:none">
      <div class="fld"><label>Имя пользователя</label><input type="text" id="regLogin" placeholder="Твой ник" maxlength="24"><div class="hint" style="font-size:11px;color:var(--muted);margin-top:2px">После регистрации нельзя изменить</div></div>
      <div class="fld"><label>Email</label><input type="email" id="regEmail" placeholder="ivan@mail.ru"></div>
      <div class="fld"><label>Пароль (мин 6 символов)</label><input type="password" id="regPwd" placeholder="••••••••"></div>
      <div class="fld"><label>Подтверждение</label><input type="password" id="regPwd2" placeholder="••••••••"></div>
      <button class="btn btn-full" onclick="registerUser()">Зарегистрироваться</button>
      <div id="regMsg" style="margin-top:8px;font-size:13px;text-align:center"></div>
    </div>
  </div>
</div>

<footer>
  <a href="https://gusarovbllm.github.io/hoolstime/">Магазин</a> · <a href="#">Форум</a> · <a href="#">Соглашение</a> · <a href="#">Политика</a><br>
  © 2026 HoolsTime · <span style="color:var(--body50)">hoolstime.ru</span>
</footer>

<script>
const CATS = [
  {id:'discuss',ic:'💬',name:'Обсуждения',desc:'Свободное общение, вопросы по игре.',threads:0,msgs:0},
  {id:'guides',ic:'📘',name:'Гайды и туториалы',desc:'Советы по выживанию, крафту, защите баз.',threads:0,msgs:0},
  {id:'trade',ic:'💰',name:'Торговля',desc:'Обмен ресурсами, услугами.',threads:0,msgs:0},
  {id:'clans',ic:'⚔️',name:'Кланы',desc:'Создание и набор участников.',threads:0,msgs:0}
];
const ROLES_RU = {guest:'Гость',player:'Игрок',verified:'Проверенный',helper:'Хелпер',moderator:'Модератор',admin:'Администратор'};
const ROLE_CLASS = {guest:'guest',player:'player',verified:'verified',helper:'helper',moderator:'mod',admin:'admin'};

let curUser = null, curSection = null;

function $(id){return document.getElementById(id)}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function notif(t,type){const d=document.createElement('div');d.className='notif'+(type?' '+type:'');d.textContent=t;document.body.appendChild(d);setTimeout(()=>{d.style.opacity='0';d.style.transition='opacity .3s';setTimeout(()=>d.remove(),300)},3200)}
function nowISO(){return new Date().toISOString()}
function getUsers(){return JSON.parse(localStorage.getItem('ht_users')||'[]')}
function saveUsers(u){localStorage.setItem('ht_users',JSON.stringify(u))}
function getTopics(s){const a=JSON.parse(localStorage.getItem('ht_topics')||'[]');return s?a.filter(t=>t.section===s).sort((a,b)=>new Date(b.date)-new Date(a.date)):a}
function saveTopics(t){localStorage.setItem('ht_topics',JSON.stringify(t))}

// Stats
function updateStats(){
  const t=getTopics();$('stTopics').textContent=t.length;
  $('stPosts').textContent=t.reduce((s,x)=>s+(x.replies||0),0)+t.length;
  $('stUsers').textContent=getUsers().length;
}

// Auth
function openAuthModal(tab){$('authModal').classList.add('open');switchAuth(tab||'login')}
function closeAuthModal(){$('authModal').classList.remove('open')}
function switchAuth(t){
  document.querySelectorAll('.mtab').forEach(b=>b.classList.toggle('active',b.dataset.t===t));
  $('authLogin').style.display=t==='login'?'block':'none';
  $('authRegister').style.display=t==='register'?'block':'none';
  $('authTitle').textContent=t==='login'?'Вход':'Регистрация';
  $('authSub').textContent=t==='login'?'Войдите в аккаунт':'Создайте аккаунт';
}
$('authModal').addEventListener('click',e=>{if(e.target===$('authModal'))closeAuthModal()});

function registerUser(){
  const l=$('regLogin').value.trim(),e=$('regEmail').value.trim(),p=$('regPwd').value,p2=$('regPwd2').value,m=$('regMsg');
  if(l.length<3){m.textContent='Логин минимум 3 символа';m.style.color='var(--red)';return}
  if(!e.includes('@')){m.textContent='Некорректный email';m.style.color='var(--red)';return}
  if(p.length<6){m.textContent='Пароль минимум 6 символов';m.style.color='var(--red)';return}
  if(p!==p2){m.textContent='Пароли не совпадают';m.style.color='var(--red)';return}
  const u=getUsers();
  if(u.find(x=>x.login===l)){m.textContent='Логин занят';m.style.color='var(--red)';return}
  if(u.find(x=>x.email===e)){m.textContent='Email уже используется';m.style.color='var(--red)';return}
  u.push({login:l,email:e,pwd:p,role:'player',regDate:nowISO(),bio:'',avatar:'',banner:''});
  saveUsers(u);
  curUser={login:l,role:'player',email:e};saveState();closeAuthModal();m.textContent='';
  updateUI();notif('Добро пожаловать, '+l+'!','gold');updateStats();
}

function loginUser(){
  const id=$('loginId').value.trim(),p=$('loginPwd').value,m=$('loginMsg');
  if(!id||!p){m.textContent='Заполните поля';m.style.color='var(--red)';return}
  const u=getUsers().find(x=>x.login===id||x.email===id);
  if(!u||u.pwd!==p){m.textContent='Неверные данные';m.style.color='var(--red)';return}
  curUser={login:u.login,role:u.role,email:u.email};saveState();closeAuthModal();m.textContent='';
  updateUI();notif('С возвращением, '+u.login+'!','gold');updateStats();
}

function logoutUser(){curUser=null;localStorage.removeItem('ht_curUser');updateUI();notif('Вы вышли')}
function saveState(){if(curUser)localStorage.setItem('ht_curUser',JSON.stringify(curUser));else localStorage.removeItem('ht_curUser')}

function updateUI(){
  if(curUser){
    $('hdrLogged').style.display='inline-flex';$('hdrGuest').style.display='none';
    $('hdrUser').textContent=curUser.login;
  } else {
    $('hdrLogged').style.display='none';$('hdrGuest').style.display='';
  }
}

// Forum
function renderCats(){
  const g=$('forumCategories');g.innerHTML='';
  CATS.forEach(c=>{
    const t=getTopics(c.id);
    c.threads=t.length;c.msgs=t.reduce((s,x)=>s+(x.replies||0),0)+t.length;
    const lastTopic=t.length?t[0]:null;
    g.innerHTML+=`
      <div class="cat">
        <div class="cat-header">
          <div><h3>${c.ic} ${c.name}</h3><div class="cat-desc">${c.desc}</div></div>
        </div>
        <div class="forum-row" onclick="openSection('${c.id}')">
          <div class="fr-info">
            <div class="fr-icon">${c.ic}</div>
            <div><h4>${c.name}</h4><p>${c.desc}</p></div>
          </div>
          <div class="fr-stats"><b>${c.threads}</b> тем<br><b>${c.msgs}</b> сообщений</div>
          <div class="fr-last">
            ${lastTopic?`
              <div class="ava">${lastTopic.author.charAt(0).toUpperCase()}</div>
              <div><div class="l-title">${esc(lastTopic.title)}</div>
              <span class="auth">${esc(lastTopic.author)}</span> · ${new Date(lastTopic.date).toLocaleDateString('ru-RU')}</div>
            `:'<span style="color:var(--muted)">Нет тем</span>'}
          </div>
        </div>
      </div>`;
  });
}

function openSection(id){
  curSection=id;const c=CATS.find(x=>x.id===id);
  $('tvTitle').textContent=c.ic+' '+c.name;$('topicView').style.display='block';$('forumCategories').style.display='none';
  renderTopics(id);
}
function backToForum(){$('topicView').style.display='none';$('forumCategories').style.display='grid';$('topicFormArea').style.display='none';curSection=null}

function renderTopics(sId){
  const l=$('topicList');l.innerHTML='';const t=getTopics(sId);
  if(!t.length){l.innerHTML='<div style="text-align:center;padding:40px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);color:var(--muted)">В разделе пока нет тем</div>';return}
  t.forEach(tp=>{
    const d=document.createElement('div');d.className='topic-row';
    if(tp.closed) d.style.opacity='0.7';
    const p=tp.template?'<span class="prefix">['+tp.template+']</span> ':'';
    const lock = tp.closed ? ' 🔒' : '';
    d.innerHTML=`<div><div class="tr-title">${p}${esc(tp.title)}${lock}</div><div class="tr-meta"><a href="javascript:void(0)" onclick="event.stopPropagation();showProfile('${esc(tp.author)}')" class="auth">${esc(tp.author)}</a> <span class="role-tag ${tp.authorRole||'player'}">${ROLES_RU[tp.authorRole]||'Игрок'}</span> · ${new Date(tp.date).toLocaleDateString('ru-RU')}</div></div><div class="tr-right">💬 ${tp.replies||0}</div>`;
    d.onclick = () => openTopic(tp.id);
    l.appendChild(d);
  });
}

// ─── Topic detail view ───
let currentTopicId = null;

function openTopic(id){
  const topics = getTopics();
  const tp = topics.find(x => x.id === id);
  if(!tp) return;
  currentTopicId = id;
  $('topicView').style.display='none';
  $('topicFormArea').style.display='none';
  
  const replies = JSON.parse(localStorage.getItem('ht_replies')||'[]').filter(r => r.topicId === id);
  let repliesHtml = '';
  replies.forEach(r => {
    const u = getUsers().find(x => x.login === r.author);
    const ava = u && u.avatar ? `style="background-image:url(${u.avatar})"` : '';
    repliesHtml += `
      <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
          <div class="avatar" ${ava}>${u ? u.login.charAt(0).toUpperCase() : '?'}</div>
          <div><div style="font-weight:700;color:var(--title);font-size:14px">${esc(r.author)} <span class="role-tag ${r.authorRole||'player'}">${ROLES_RU[r.authorRole]||'Игрок'}</span></div>
          <div style="font-size:11px;color:var(--body50)">${new Date(r.date).toLocaleString('ru-RU')}</div></div>
        </div>
        <div style="font-size:13px;color:var(--body);line-height:1.6;white-space:pre-wrap">${esc(r.body)}</div>
      </div>`;
  });

  const canReply = !tp.closed && curUser;
  const canClose = curUser && (curUser.role === 'admin' || curUser.role === 'moderator' || curUser.role === 'helper');
  const isAuthor = curUser && curUser.login === tp.author;

  $('forumCategories').innerHTML = `
    <div style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px">
        <h2 style="font-size:20px;font-weight:900;color:var(--title)">${tp.closed?'🔒 ':''}${esc(tp.title)}</h2>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn btn-sm btn-ghost" onclick="backFromTopic()">← Назад</button>
          ${canClose?'<button class="btn btn-sm btn-danger" onclick="toggleCloseTopic(\''+tp.id+'\')">'+(tp.closed?'🔓 Открыть тему':'🔒 Закрыть тему')+'</button>':''}
        </div>
      </div>
      <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
          <div class="avatar">${tp.author.charAt(0).toUpperCase()}</div>
          <div><div style="font-weight:700;color:var(--title);font-size:14px">${esc(tp.author)} <span class="role-tag ${tp.authorRole||'player'}">${ROLES_RU[tp.authorRole]||'Игрок'}</span></div>
          <div style="font-size:11px;color:var(--body50)">${new Date(tp.date).toLocaleString('ru-RU')}</div></div>
        </div>
        <div style="font-size:13px;color:var(--body);line-height:1.6;white-space:pre-wrap">${esc(tp.body)}</div>
      </div>
      ${tp.closed?'<div style="text-align:center;padding:12px;background:rgba(239,68,68,.08);border:1px solid var(--red);border-radius:var(--radius);margin-bottom:16px;color:var(--red);font-size:13px;font-weight:700">🔒 Тема закрыта администратором. Ответы невозможны.</div>':''}
      ${repliesHtml}
      ${canReply?`
        <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:16px">
          <h4 style="font-size:14px;font-weight:800;color:var(--title);margin-bottom:10px">✏️ Ответить</h4>
          <textarea id="replyBody" style="width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--title);border-radius:6px;padding:10px;font-size:13px;min-height:60px;font-family:inherit" placeholder="Ваш ответ..."></textarea>
          <button class="btn btn-sm" style="margin-top:8px" onclick="submitReply('${tp.id}')">Отправить</button>
          <div id="replyMsg" style="margin-top:6px;font-size:13px"></div>
        </div>
      `:''}
    </div>`;
  $('forumCategories').style.display = 'block';
}

function backFromTopic(){
  $('forumCategories').style.display='none';
  $('topicView').style.display='block';
  renderTopics(curSection);
  currentTopicId = null;
}

function submitReply(id){
  const body = $('replyBody')?.value?.trim();
  if(!body){$('replyMsg').textContent='Напишите ответ';$('replyMsg').style.color='var(--red)';return}
  const replies = JSON.parse(localStorage.getItem('ht_replies')||'[]');
  replies.push({topicId:id, author:curUser.login, authorRole:curUser.role, body, date:nowISO()});
  localStorage.setItem('ht_replies',JSON.stringify(replies));
  // Update reply count
  const topics = getTopics();
  const tp = topics.find(x => x.id === id);
  if(tp) tp.replies = (tp.replies||0) + 1;
  saveTopics(topics);
  $('replyBody').value='';
  openTopic(id);
  notif('Ответ отправлен','gold');
  updateStats();
}

function toggleCloseTopic(id){
  const topics = getTopics();
  const tp = topics.find(x => x.id === id);
  if(!tp) return;
  if(!curUser || (curUser.role !== 'admin' && curUser.role !== 'moderator' && curUser.role !== 'helper')) {
    notif('Нет прав','err');return;
  }
  tp.closed = !tp.closed;
  saveTopics(topics);
  openTopic(id);
  notif(tp.closed ? 'Тема закрыта' : 'Тема открыта','gold');
}

function showTopicForm(){
  if(!curUser){notif('Войдите сначала','err');return}
  if(!curSection)return;
  $('topicFormArea').style.display='block';
  $('topicForm').innerHTML=`
    <div class="fld"><label>Заголовок</label><input id="tfTitle" placeholder="Заголовок темы"></div>
    <div class="fld"><label>Содержание</label><textarea id="tfBody" style="width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--title);border-radius:6px;padding:10px;font-size:14px;min-height:80px;font-family:inherit" placeholder="Ваше сообщение..."></textarea></div>
    <div style="display:flex;gap:8px"><button class="btn" onclick="submitTopic()">📌 Создать</button><button class="btn btn-ghost" onclick="hideTopicForm()">Отмена</button></div>
    <div id="tsMsg" style="margin-top:8px;font-size:13px"></div>`;
  $('topicFormArea').scrollIntoView({behavior:'smooth'});
}
function hideTopicForm(){$('topicFormArea').style.display='none'}

function submitTopic(){
  const title=($('tfTitle')?.value||'').trim(),body=($('tfBody')?.value||'').trim(),msg=$('tsMsg');
  if(!title){msg.textContent='Нужен заголовок';msg.style.color='var(--red)';return}
  if(!body){msg.textContent='Добавьте содержание';msg.style.color='var(--red)';return}
  const topics=getTopics();
  topics.push({id:'HT-'+Date.now(),section:curSection,title,body,author:curUser.login,authorRole:curUser.role,date:nowISO(),replies:0,closed:false});
  saveTopics(topics);
  msg.textContent='Тема создана!';msg.style.color='var(--green)';
  hideTopicForm();renderTopics(curSection);notif('Тема создана','gold');updateStats();
}

// Profile
function showProfile(login){
  const targetLogin = login || (curUser ? curUser.login : '');
  if(!targetLogin){notif('Войдите','err');return}
  const u = getUsers().find(x => x.login === targetLogin);
  if(!u){notif('Пользователь не найден','err');return}
  const isOwn = curUser && curUser.login === targetLogin;
  const topics = getTopics().filter(t => t.author === targetLogin);
  const replies = JSON.parse(localStorage.getItem('ht_replies')||'[]').filter(r => r.author === targetLogin);

  $('forumView').style.display='none';$('profileView').style.display='block';
  const banner = u.banner ? `style="background-image:url(${u.banner});background-position-y:50%"` : '';
  const ava = u.avatar ? `style="background-image:url(${u.avatar})"` : '';
  const roleClass = u.role || 'player';

  $('profileView').innerHTML = `
    <div class="block" style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden">
      <div class="memberHeader${u.banner?' memberHeader--withBanner':''}">
        <div class="memberProfileBanner"${banner}>
          <div class="memberHeader-mainContent" style="padding:20px;display:flex;align-items:flex-end;gap:20px;${u.banner?'background:linear-gradient(transparent,rgba(0,0,0,.7));padding-top:80px':''}">
            <div class="avatar" style="width:96px;height:96px;font-size:36px;flex:0 0 96px;border:3px solid var(--accent)" ${ava}>${u.avatar?'':targetLogin.charAt(0).toUpperCase()}</div>
            <div style="flex:1">
              <h1 style="font-size:22px;font-weight:900;color:var(--title);margin-bottom:4px">${esc(targetLogin)} ${isOwn?'<button class="btn btn-sm btn-ghost" onclick="closeProfile()" style="float:right">← Назад</button>':''}</h1>
              <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px">
                <span class="role-tag ${roleClass}">${ROLES_RU[roleClass]||'Игрок'}</span>
                ${roleClass === 'admin' ? '<span class="role-tag" style="background:rgba(239,68,68,.15);color:var(--red)">АДМИНИСТРАТОР</span>' : ''}
                ${roleClass === 'moderator' ? '<span class="role-tag" style="background:rgba(59,130,246,.12);color:var(--blue)">МОДЕРАТОР</span>' : ''}
                ${roleClass === 'helper' ? '<span class="role-tag" style="background:rgba(240,180,41,.12);color:var(--gold)">ХЕЛПЕР</span>' : ''}
              </div>
              <div style="font-size:12px;color:var(--body50)">${u.bio ? esc(u.bio) : 'Нет информации'}</div>
            </div>
          </div>
        </div>
      </div>
      <div style="padding:16px 20px;border-top:1px solid var(--border);display:flex;gap:32px;flex-wrap:wrap">
        <dl style="text-align:center"><dt style="font-size:11px;color:var(--body50);text-transform:uppercase">Сообщения</dt><dd style="font-size:22px;font-weight:900;color:var(--title)">${topics.length + replies.length}</dd></dl>
        <dl style="text-align:center"><dt style="font-size:11px;color:var(--body50);text-transform:uppercase">Темы</dt><dd style="font-size:22px;font-weight:900;color:var(--title)">${topics.length}</dd></dl>
        <dl style="text-align:center"><dt style="font-size:11px;color:var(--body50);text-transform:uppercase">Регистрация</dt><dd style="font-size:14px;font-weight:700;color:var(--title)">${u.regDate?new Date(u.regDate).toLocaleDateString('ru-RU'):'—'}</dd></dl>
      </div>
    </div>
    ${isOwn ? `
    <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:16px">
      <h4 style="font-size:14px;font-weight:800;color:var(--title);margin-bottom:10px">⚙️ Настройки профиля</h4>
      <div class="fld"><label>Аватар</label><input type="file" accept="image/*" onchange="upAvatar(this)"></div>
      <div class="fld"><label>Баннер</label><input type="file" accept="image/*" onchange="upBanner(this)"></div>
      <div class="fld"><label>О себе</label><textarea id="bioInput" style="width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--title);border-radius:6px;padding:10px;font-size:13px;min-height:60px;font-family:inherit">${esc(u.bio||'')}</textarea></div>
      <button class="btn btn-sm" onclick="saveBio()">Сохранить</button>
    </div>` : ''}
    <div style="margin-top:20px">
      <h4 style="font-size:16px;font-weight:900;color:var(--title);margin-bottom:12px">📌 Последние темы</h4>
      ${topics.slice(0,5).map(t => `
        <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;margin-bottom:6px;cursor:pointer" onclick="openTopic('${t.id}')">
          <div style="font-weight:600;color:var(--title);font-size:13px">${esc(t.title)}</div>
          <div style="font-size:11px;color:var(--body50);margin-top:2px">${new Date(t.date).toLocaleDateString('ru-RU')} · 💬 ${t.replies||0}</div>
        </div>
      `).join('') || '<div style="color:var(--muted);font-size:13px">Нет тем</div>'}
    </div>`;
}

function closeProfile(){$('forumView').style.display='block';$('profileView').style.display='none'}
function saveBio(){if(!curUser)return;const u=getUsers();const i=u.findIndex(x=>x.login===curUser.login);if(i<0)return;u[i].bio=$('bioInput').value;saveUsers(u);notif('Сохранено','gold')}
function upAvatar(inp){if(!curUser||!inp.files[0])return;const r=new FileReader();r.onload=function(e){const u=getUsers();const i=u.findIndex(x=>x.login===curUser.login);if(i<0)return;u[i].avatar=e.target.result;saveUsers(u);showProfile(curUser.login);notif('Аватар обновлён','gold')};r.readAsDataURL(inp.files[0])}
function upBanner(inp){if(!curUser||!inp.files[0])return;const r=new FileReader();r.onload=function(e){const u=getUsers();const i=u.findIndex(x=>x.login===curUser.login);if(i<0)return;u[i].banner=e.target.result;saveUsers(u);showProfile(curUser.login);notif('Баннер обновлён','gold')};r.readAsDataURL(inp.files[0])}

// Init
const saved=localStorage.getItem('ht_curUser');
if(saved)curUser=JSON.parse(saved);
renderCats();updateUI();updateStats();
</script>
</body>
</html>
